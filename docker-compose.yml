services:
  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:20-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY public ./public
        COPY src ./src
        COPY tsconfig.json ./
        RUN npm run build

        FROM nginx:1.27-alpine
        COPY --from=build /app/build /usr/share/nginx/html
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        EXPOSE 80
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM eclipse-temurin:21-jdk AS build
        WORKDIR /app
        COPY gradlew build.gradle settings.gradle ./
        COPY gradle ./gradle
        COPY src ./src
        RUN chmod +x gradlew && ./gradlew bootJar --no-daemon

        FROM eclipse-temurin:21-jre
        WORKDIR /app
        COPY --from=build /app/build/libs/*.jar app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
    environment:
      DB_URL: jdbc:mysql://sql:3306/catlog
      DB_USER: catlog
      DB_PASSWORD: ${MYSQL_PASSWORD:-catlog_local_password}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      sql:
        condition: service_healthy

  sql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: catlog
      MYSQL_USER: catlog
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-catlog_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-catlog_local_root_password}
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u catlog -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' catlog >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
